[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torquetune"
version = "0.1.0"
description = "Torque-structured engine management: model, analysis tools and tuner application"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "PySide6",
    "pyqtgraph",
]

[project.optional-dependencies]
build = ["pyinstaller"]

[project.scripts]
torquetune = "tuner.app:main"

[tool.setuptools.packages.find]
include = ["tqmodel*", "tuner*"]
