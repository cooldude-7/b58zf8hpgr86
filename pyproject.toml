[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torquetune"
version = "0.1.0"
description = "Torque-structured engine management: model, analysis tools and tuner application"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "PySide6",
    "pyqtgraph",
]

[project.optional-dependencies]
test = ["pytest>=7"]
build = ["pyinstaller"]
sound = ["sounddevice"]

[project.scripts]
torquetune = "tuner.app:main"

[tool.setuptools.packages.find]
include = ["tqmodel*", "tuner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the narrative scripts are run by tests/test_scripts.py as subprocesses,
# so pytest must not also collect them at import time
addopts = "-q --ignore=tests/test_sim.py --ignore=tests/test_live.py --ignore=tests/test_editor_gui.py --ignore=tests/test_tableops.py"
