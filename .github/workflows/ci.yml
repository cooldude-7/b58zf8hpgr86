name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen      # no display on a runner
      LAMBDAONE_NO_AUDIO: "1"        # no sound card either
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System libraries Qt needs even headless
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Tests (Python and firmware)
        run: python -m pytest

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test the firmware on the host
        run: |
          cmake -S fw -B build/fw -DCMAKE_BUILD_TYPE=Release
          cmake --build build/fw -j
          ctest --test-dir build/fw --output-on-failure
